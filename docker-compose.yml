services:
  db:
    image: postgres:15-alpine
    container_name: ntp_postgres_ecosystem
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ntp_support}
    ports:
      # Chỉ bind localhost — không mở Postgres ra Internet khi chạy trên VPS
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_ecosystem:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ntp-support-hub/server
      dockerfile: Dockerfile
    container_name: ntp_backend_ecosystem
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ntp_support}
      - PORT=5000
    volumes:
      - ./ntp-support-hub/document_technical:/app/document_technical
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ntp_frontend_ecosystem
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./ntp-support-hub/document_technical:/usr/share/nginx/html/documents
    depends_on:
      - backend

volumes:
  postgres_data_ecosystem:
