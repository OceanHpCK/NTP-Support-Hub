services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: ntp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Node.js
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ntp_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - ./document_technical:/app/document_technical
    depends_on:
      db:
        condition: service_healthy

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: ntp_frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./document_technical:/usr/share/nginx/html/documents
    depends_on:
      - backend

volumes:
  postgres_data:
