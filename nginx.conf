server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 15M;

    # Support Hub (Root)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Calculators
    location /hdd-pro-calculator/ {
        try_files $uri $uri/ /hdd-pro-calculator/index.html;
    }

    location /hdpe-sinking-calculator/ {
        try_files $uri $uri/ /hdpe-sinking-calculator/index.html;
    }

    location /pipe-heat-loss-calculator/ {
        try_files $uri $uri/ /pipe-heat-loss-calculator/index.html;
    }

    location /pipecalc-pro/ {
        try_files $uri $uri/ /pipecalc-pro/index.html;
    }

    location /polyweld-pro/ {
        try_files $uri $uri/ /polyweld-pro/index.html;
    }

    location /tien-phong-cement-calculator/ {
        try_files $uri $uri/ /tien-phong-cement-calculator/index.html;
    }

    location /water-hammer-calculator/ {
        try_files $uri $uri/ /water-hammer-calculator/index.html;
    }

    # API Proxy to backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
